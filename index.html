<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Seatwork 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>
<body>
    <div class="page-container">

        <!-- About Me Card -->
        <div class="about-card">
            <h1>About Me</h1>
            <div id="about-output"></div>
        </div>

        <div class="calc-card">
            <h1>Calculator</h1>

            <!-- Calculator Form -->
            <form>
                <label>Enter 1st Number:</label><br>
                <input type="number" id="num1" class="form-control-sm" placeholder="First Number"><br>

                <label>Enter 2nd Number:</label><br>
                <input type="number" id="num2" class="form-control-sm" placeholder="Second Number"><br>

                <!-- Buttons that trigger the function -->
                <button type="button" class="btn btn-light" py-click="adding_numbers">+</button>
                <button type="button" class="btn btn-light" py-click="subtracting_numbers">-</button>
                <button type="button" class="btn btn-light" py-click="multiplying_numbers">x</button>
                <button type="button" class="btn btn-light" py-click="dividing_numbers">÷</button>
                <button type="button" class="btn btn-light" py-click="modulo_numbers">%</button>
            </form>

            <div id="output1">?</div>
        </div>

    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
